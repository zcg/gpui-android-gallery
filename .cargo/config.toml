# WebAssembly threading (shared memory + atomics) needs these flags, and
# `build-std` rebuilds core with them. Both are nightly-only, so the web build
# runs with `RUSTUP_TOOLCHAIN=nightly`. The section is scoped to the wasm target,
# so Android and desktop builds are unaffected.
[target.wasm32-unknown-unknown]
rustflags = [
    "-Z", "llvm-target-feature=+atomics",
    "-C", "target-feature=+bulk-memory,+mutable-globals",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--max-memory=1073741824",
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--export=__heap_base",
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
    "-C", "link-arg=--export=__tls_base",
]

[unstable]
build-std = ["std", "panic_abort"]
